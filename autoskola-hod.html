<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="hod-components.jsx"></script>
<script type="text/babel" src="hod-sections.jsx"></script>
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "mode": "dark",
  "accentPair": "brand",
  "fontPair": "duhodah",
  "intensity": "all-in",
  "heroVariant": "gauge"
}/*EDITMODE-END*/;

const ACCENT_PAIRS = {
  'fire-ice':    { hot: '#ff5a3a', mid: '#f2b441', cool: '#6bdcff', soft: '#b5a8ff' },
  'brand':       { hot: '#d702f1', mid: '#9aabd8', cool: '#04ffff', soft: '#9aabd8' },
  'ember':       { hot: '#ff7849', mid: '#ffbe55', cool: '#8de0a8', soft: '#c9b18c' },
  'monochrome':  { hot: '#e8e6dc', mid: '#bfbdb4', cool: '#8d8b84', soft: '#5a5852' },
  'electric':    { hot: '#ff2e88', mid: '#f0ec3b', cool: '#3bf0e0', soft: '#a86bff' },
};

const FONT_PAIRS = {
  'duhodah':      { display: "'Jura', system-ui, sans-serif", body: "'Inter', system-ui, sans-serif", mono: "'Montserrat', system-ui, sans-serif" },
  'grotesk-mono': { display: "'Space Grotesk', system-ui, sans-serif", body: "'Inter', system-ui, sans-serif", mono: "'JetBrains Mono', ui-monospace, monospace" },
  'editorial':    { display: "'Fraunces', 'Instrument Serif', Georgia, serif", body: "'Inter', system-ui, sans-serif", mono: "'JetBrains Mono', ui-monospace, monospace" },
  'serif-mix':    { display: "'Instrument Serif', Georgia, serif", body: "'Inter', system-ui, sans-serif", mono: "'JetBrains Mono', ui-monospace, monospace" },
  'mono-heavy':   { display: "'JetBrains Mono', ui-monospace, monospace", body: "'Inter', system-ui, sans-serif", mono: "'JetBrains Mono', ui-monospace, monospace" },
};

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  React.useEffect(() => {
    const root = document.documentElement;
    const a = ACCENT_PAIRS[t.accentPair] || ACCENT_PAIRS['fire-ice'];
    root.style.setProperty('--hod-accent-hot', a.hot);
    root.style.setProperty('--hod-accent-mid', a.mid);
    root.style.setProperty('--hod-accent-cool', a.cool);
    root.style.setProperty('--hod-accent-soft', a.soft);

    const f = FONT_PAIRS[t.fontPair] || FONT_PAIRS['grotesk-mono'];
    root.style.setProperty('--hod-font-display', f.display);
    root.style.setProperty('--hod-font-body', f.body);
    root.style.setProperty('--hod-font-mono', f.mono);

    document.body.classList.toggle('mode-light', t.mode === 'light');
    document.body.classList.remove('intensity-subtle', 'intensity-med', 'intensity-all');
    document.body.classList.add('intensity-' + (t.intensity === 'all-in' ? 'all' : t.intensity));
  }, [t.accentPair, t.fontPair, t.mode, t.intensity]);

  return (
    <>
      <HeroSection variant={t.heroVariant} />
      <PainSection />
      <AlternativesSection />
      <EpiphanySection />
      <FascinationsSection />
      <ProgramIntroSection />
      <CurriculumSection />
      <FitSection />
      <TestimonialsSection />
      <GuaranteeSection />
      <UpisiSection />
      <InactionSection />
      <FaqSection />
      <FooterSection />

      <TweaksPanel title="Tweaks — HOD">
        <TweakSection label="Hero" />
        <TweakRadio label="Hero varijanta" value={t.heroVariant}
          options={[
            { value: 'gauge', label: 'Brzinomjer (ANS)' },
            { value: 'circle', label: 'Breathing cycle' },
            { value: 'vitals', label: 'Vitals · 02:47' },
          ]}
          onChange={(v) => setTweak('heroVariant', v)} />

        <TweakSection label="Paleta" />
        <TweakRadio label="Akcenti" value={t.accentPair}
          options={[
            { value: 'fire-ice', label: 'Fire · Ice' },
            { value: 'brand', label: 'Brand (Duhodah)' },
            { value: 'ember', label: 'Ember' },
            { value: 'monochrome', label: 'Monochrome' },
            { value: 'electric', label: 'Electric' },
          ]}
          onChange={(v) => setTweak('accentPair', v)} />
        <TweakRadio label="Mode" value={t.mode}
          options={['dark', 'light']}
          onChange={(v) => setTweak('mode', v)} />

        <TweakSection label="Tipografija" />
        <TweakRadio label="Font pairing" value={t.fontPair}
          options={[
            { value: 'duhodah', label: 'Duhodah (Jura + Montserrat)' },
            { value: 'grotesk-mono', label: 'Grotesk + Mono' },
            { value: 'editorial', label: 'Editorial (Fraunces)' },
            { value: 'serif-mix', label: 'Instrument Serif' },
            { value: 'mono-heavy', label: 'Mono heavy' },
          ]}
          onChange={(v) => setTweak('fontPair', v)} />

        <TweakSection label="Intensity metafore" />
        <TweakRadio label="HUD chrome" value={t.intensity}
          options={[
            { value: 'subtle', label: 'Suptilno' },
            { value: 'med', label: 'Srednje' },
            { value: 'all-in', label: 'All-in' },
          ]}
          onChange={(v) => setTweak('intensity', v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
