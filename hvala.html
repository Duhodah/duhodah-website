<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hvala — Duhodah</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/jpeg" href="images/duhodah-logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jura:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --black:   #08081a;
      --dark:    #0d0d22;
      --cyan:    #04ffff;
      --magenta: #d702f1;
      --steel:   #aad0e4;
      --white:   #f0f0f8;
      --font-brand: 'Montserrat', sans-serif;
      --font-head:  'Jura', sans-serif;
      --font-body:  'Inter', sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      min-height: 100vh;
      background: var(--black);
      color: var(--white);
      font-family: var(--font-body);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .logo {
      font-family: var(--font-brand);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 3rem;
      opacity: 0.7;
    }

    .check-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid rgba(4,255,255,0.3);
      background: rgba(4,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      animation: pulse-in 0.6s ease forwards;
    }

    .check-circle svg {
      width: 36px;
      height: 36px;
      stroke: var(--cyan);
      stroke-width: 2.5;
      fill: none;
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: draw-check 0.5s ease 0.3s forwards;
    }

    @keyframes pulse-in {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    @keyframes draw-check {
      to { stroke-dashoffset: 0; }
    }

    .hvala-title {
      font-family: var(--font-head);
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 300;
      letter-spacing: 0.08em;
      color: var(--white);
      margin-bottom: 1rem;
    }

    .hvala-sub {
      font-size: 1rem;
      color: var(--steel);
      line-height: 1.7;
      max-width: 480px;
      margin: 0 auto 2.5rem;
    }

    .hvala-sub strong {
      color: var(--white);
    }

    .divider {
      width: 40px;
      height: 1px;
      background: rgba(4,255,255,0.3);
      margin: 0 auto 2.5rem;
    }

    .next-steps {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 420px;
      width: 100%;
      margin-bottom: 3rem;
    }

    .step {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      text-align: left;
      background: rgba(4,255,255,0.04);
      border: 1px solid rgba(4,255,255,0.1);
      border-radius: 8px;
      padding: 1rem 1.2rem;
    }

    .step-num {
      font-family: var(--font-brand);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--cyan);
      opacity: 0.7;
      flex-shrink: 0;
      padding-top: 2px;
    }

    .step-text {
      font-size: 0.88rem;
      color: rgba(255,255,255,0.7);
      line-height: 1.55;
    }

    .step-text strong {
      color: var(--white);
      display: block;
      margin-bottom: 0.2rem;
    }

    .btn-home {
      display: inline-block;
      font-family: var(--font-brand);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--black);
      background: var(--cyan);
      padding: 0.9rem 2.2rem;
      text-decoration: none;
      transition: box-shadow 0.3s, transform 0.3s;
    }

    .btn-home:hover {
      box-shadow: 0 0 30px rgba(4,255,255,0.4);
      transform: translateY(-2px);
    }

    .btn-events {
      display: inline-block;
      font-family: var(--font-brand);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--cyan);
      border: 1px solid rgba(4,255,255,0.3);
      padding: 0.9rem 2.2rem;
      text-decoration: none;
      margin-left: 1rem;
      transition: border-color 0.3s, background 0.3s;
    }

    .btn-events:hover {
      border-color: var(--cyan);
      background: rgba(4,255,255,0.06);
    }

    .btn-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Pretplatnik varijanta */
    .pretplata-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(215,2,241,0.1);
      border: 1px solid rgba(215,2,241,0.3);
      border-radius: 20px;
      padding: 0.4rem 1rem;
      font-family: var(--font-brand);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--magenta);
      margin-bottom: 1.5rem;
    }

    @media (max-width: 480px) {
      .btn-events { margin-left: 0; }
    }
  </style>
</head>
<body>

  <div class="logo">Duhodah</div>

  <div class="check-circle">
    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
  </div>

  <!-- Sadržaj se mijenja JS-om ovisno o tipu kupnje -->
  <div id="hvala-content">
    <h1 class="hvala-title">Hvala ti.</h1>
    <p class="hvala-sub">Plaćanje je primljeno. Vidimo se uskoro.</p>
  </div>

  <div class="divider"></div>

  <div class="next-steps" id="next-steps"></div>

  <div class="btn-row">
    <a href="events.html" class="btn-home">Pogledaj termine →</a>
    <a href="index.html" class="btn-events">Naslovna</a>
  </div>

  <script type="module">
    import { supabase } from './js/supabase-config.js';

    const params  = new URLSearchParams(window.location.search);
    const tip     = params.get('tip'); // 'pretplata' | 'karta'
    const eventId = params.get('event');

    const contentEl   = document.getElementById('hvala-content');
    const nextStepsEl = document.getElementById('next-steps');

    if (tip === 'pretplata') {
      contentEl.innerHTML = `
        <div class="pretplata-badge">✦ Novi pretplatnik</div>
        <h1 class="hvala-title">Dobrodošao/la u Zajednicu.</h1>
        <p class="hvala-sub">
          Pretplata je aktivna. Sada imaš <strong>neograničen pristup</strong>
          svim Breathwork Journey sesijama i Autoškoli — bez dodatnih troškova.
        </p>`;
      nextStepsEl.innerHTML = `
        <div class="step">
          <span class="step-num">01</span>
          <div class="step-text"><strong>Provjeri inbox</strong>Stripe je poslao potvrdu računa na tvoj email.</div>
        </div>
        <div class="step">
          <span class="step-num">02</span>
          <div class="step-text"><strong>Prijavi se na termine</strong>Na stranici Termini sada vidiš gumb "Prijavi se besplatno →" za sve sesije.</div>
        </div>
        <div class="step">
          <span class="step-num">03</span>
          <div class="step-text"><strong>Otkaži kad god</strong>Bez obveza. Pretplatu možeš otkazati direktno iz Stripe portala koji ti stigne na email.</div>
        </div>`;
    } else if (tip === 'karta') {
      contentEl.innerHTML = `
        <h1 class="hvala-title">Karta je tvoja.</h1>
        <p class="hvala-sub">
          Rezervacija je potvrđena. Vidimo se na sesiji —
          samo donesi sebe i dah.
        </p>`;
      nextStepsEl.innerHTML = `
        <div class="step">
          <span class="step-num">01</span>
          <div class="step-text"><strong>Provjeri inbox</strong>Stripe šalje potvrdu računa. Spremi je za evidenciju.</div>
        </div>
        <div class="step">
          <span class="step-num">02</span>
          <div class="step-text"><strong>Lokacija</strong>Studio Shine, Ivana Gundulića 5, 3. kat, Osijek. Dođi 5 minuta ranije.</div>
        </div>
        <div class="step">
          <span class="step-num">03</span>
          <div class="step-text"><strong>Što ponijeti</strong>Udobnu odjeću, vodu, otvorenu znatiželju. Sve ostalo osigurava prostor.</div>
        </div>`;
    } else {
      // Generički fallback
      contentEl.innerHTML = `
        <h1 class="hvala-title">Hvala ti.</h1>
        <p class="hvala-sub">Plaćanje je primljeno. Provjeri inbox za potvrdu, a mi se vidimo uskoro.</p>`;
      nextStepsEl.innerHTML = `
        <div class="step">
          <span class="step-num">01</span>
          <div class="step-text"><strong>Provjeri inbox</strong>Stripe šalje potvrdu na tvoj email.</div>
        </div>
        <div class="step">
          <span class="step-num">02</span>
          <div class="step-text"><strong>Pogledaj termine</strong>Svi nadolazeći eventi su na stranici Termini.</div>
        </div>`;
    }
  </script>
</body>
</html>
